categories:
  - id: encoding
    title: Encoding
    description: >
      Encoding changes text into another form you can paste into a URL, a
      token, or a file, and changes it back. Base N encodes and decodes
      Base 16, Base 32, Base 58, Base 64, and Base 85 text. URL
      Encode/Decode prepares text for a URL component and reads it back.
      Hexadecimal encodes and decodes hexadecimal text. Binary encodes and
      decodes binary text. Octal encodes and decodes octal text. JWT
      Decoder reads a token and shows the header, the payload, and the raw
      signature. It does not check the signature.
    tools:
      - id: base-n
        title: Base N
        summary: >
          Encode text as Base 16, Base 32, Base 58, Base 64, or Base 85, and
          decode that text back. Choose the alphabet, paste the value, and
          the page writes the other form. Base 64 is the default.
        status: ready
        actions:
          - id: encode
            label: Encode
          - id: decode
            label: Decode
        fields:
          - id: base
            label: Base
            kind: choice
            default: "64"
            choices:
              - id: "16"
                label: Base 16
              - id: "32"
                label: Base 32
              - id: "58"
                label: Base 58
              - id: "64"
                label: Base 64
              - id: "85"
                label: Base 85
      - id: url-encode-decode
        title: URL Encode/Decode
        summary: >
          Percent-encode text so it is safe in a URL query or path, and decode
          a percent-encoded value back to text. Spaces, reserved characters,
          and characters outside ASCII become % sequences. The page uses the
          same rules as a URL component.
        status: ready
        actions:
          - id: encode
            label: Encode
          - id: decode
            label: Decode
      - id: hex
        title: Hexadecimal
        summary: >
          Encode text as hexadecimal, two digits for each byte, and decode a
          hexadecimal string back to text. Spaces in the hex are ignored when
          decoding. The result is UTF-8 text.
        status: ready
        actions:
          - id: encode
            label: Encode
          - id: decode
            label: Decode
      - id: binary
        title: Binary
        summary: >
          Encode text as binary, eight bits for each byte, and decode a binary
          string back to text. Spaces in the bits are ignored when decoding.
          The result is UTF-8 text.
        status: ready
        actions:
          - id: encode
            label: Encode
          - id: decode
            label: Decode
      - id: octal
        title: Octal
        summary: >
          Encode text as octal, three digits for each byte, and decode an
          octal string back to text. Spaces in the digits are ignored when
          decoding. A group above 255 is rejected.
        status: ready
        actions:
          - id: encode
            label: Encode
          - id: decode
            label: Decode
      - id: jwt-decoder
        title: JWT Decoder
        summary: >
          Paste a JSON Web Token. The page splits the three dot-separated
          parts and shows the header and the payload as formatted JSON, with
          the signature left as the raw third part. It does not check the
          signature or whether the token has expired.
        status: ready
        actions:
          - id: decode
            label: Decode
  - id: cryptography
    title: Cryptography
    description: >
      Cryptography covers hashes and certificates, calculated in the browser.
      Hash Generator hashes text you paste in. Certificate Generator creates
      a certificate. CSR Generator creates a certificate signing request.
      Certificate Inspector reads the fields in a certificate. PEM/DER
      Converter converts a certificate between PEM and DER.
    tools:
      - id: hash-generator
        title: Hash Generator
        summary: >
          Hash text you paste in with SHA-256, SHA-384, or SHA-512. The digest
          is calculated in the page. The text is not uploaded.
        status: ready
        actions:
          - id: sha-256
            label: SHA-256
          - id: sha-384
            label: SHA-384
          - id: sha-512
            label: SHA-512
      - id: certificate-generator
        title: Certificate Generator
        summary: >
          Create a self-signed certificate in the page. Set the common name,
          how many days it stays valid, and a key type: RSA 2048, RSA 3072,
          RSA 4096, ECDSA P-256, or ECDSA P-384. The page writes the
          certificate request, the certificate, and the private key.
        status: ready
        fields:
          - id: common-name
            label: Common name
            kind: text
          - id: validity-days
            label: Validity (days)
            kind: number
            default: "365"
          - id: key-type
            label: Key type
            kind: choice
            default: rsa-2048
            choices:
              - id: rsa-2048
                label: RSA 2048
              - id: rsa-3072
                label: RSA 3072
              - id: rsa-4096
                label: RSA 4096
              - id: ecdsa-p256
                label: ECDSA P-256
              - id: ecdsa-p384
                label: ECDSA P-384
        actions:
          - id: generate
            label: Generate
        outputs:
          - id: csr
            label: Certificate request
          - id: certificate
            label: Certificate
          - id: private-key
            label: Private key
      - id: csr-generator
        title: CSR Generator
        summary: >
          Create a certificate signing request in the page. Set the common
          name and a key type: RSA 2048, RSA 3072, RSA 4096, ECDSA P-256, or
          ECDSA P-384. The page writes the request and the matching private
          key.
        status: ready
        fields:
          - id: common-name
            label: Common name
            kind: text
          - id: key-type
            label: Key type
            kind: choice
            default: rsa-2048
            choices:
              - id: rsa-2048
                label: RSA 2048
              - id: rsa-3072
                label: RSA 3072
              - id: rsa-4096
                label: RSA 4096
              - id: ecdsa-p256
                label: ECDSA P-256
              - id: ecdsa-p384
                label: ECDSA P-384
        actions:
          - id: generate
            label: Generate
        outputs:
          - id: csr
            label: Certificate request
          - id: private-key
            label: Private key
      - id: certificate-inspector
        title: Certificate Inspector
        summary: >
          Paste a PEM certificate. The page reads the subject, issuer, serial
          number, not-before and not-after times, signature algorithm, and
          public key. It does not contact a certificate authority.
        status: ready
        actions:
          - id: inspect
            label: Inspect
      - id: pem-der-converter
        title: PEM/DER Converter
        summary: >
          Convert a PEM certificate to Base64-encoded DER, and convert that
          Base64 DER back to a PEM certificate. Paste one form and the page
          writes the other.
        status: ready
        actions:
          - id: to-der
            label: To DER
          - id: to-pem
            label: To PEM
  - id: dns
    title: DNS
    description: >
      DNS looks up names, addresses, and mail policy for a domain. DNS Lookup
      reads the records for a name. Reverse DNS finds the name for an IP
      address. MX Lookup lists the mail servers for a domain. SPF Inspector
      reads a domain's SPF record. DMARC Inspector reads a domain's DMARC
      record. DNSSEC Inspector checks DNSSEC for a domain. Each lookup
      is sent to the resolver you pick: Cloudflare, Google, or Quad9. This
      site does not store the query.
    tools:
      - id: dns-lookup
        title: DNS Lookup
        summary: >
          Look up DNS records for a name. Choose A, AAAA, CNAME, MX, NS, TXT,
          SOA, CAA, or SRV, and a resolver: Cloudflare, Google, or Quad9. The
          page shows each answer with its name, TTL, and data. This site sends
          the name to that resolver and does not store the query.
        status: ready
        fields:
          - id: name
            label: Name
            kind: text
          - id: resolver
            label: Resolver
            kind: choice
            default: cloudflare
            choices:
              - id: cloudflare
                label: Cloudflare
              - id: google
                label: Google
              - id: quad9
                label: Quad9
          - id: record-type
            label: Record type
            kind: choice
            default: a
            choices:
              - id: a
                label: A
              - id: aaaa
                label: AAAA
              - id: cname
                label: CNAME
              - id: mx
                label: MX
              - id: ns
                label: NS
              - id: txt
                label: TXT
              - id: soa
                label: SOA
              - id: caa
                label: CAA
              - id: srv
                label: SRV
        actions:
          - id: look-up
            label: Look Up
        outputs:
          - id: result
            label: Result
      - id: reverse-dns
        title: Reverse DNS
        summary: >
          Look up the PTR name for an IP address. Choose Cloudflare, Google,
          or Quad9 as the resolver. The page shows each answer with its name,
          TTL, and data. This site sends the address to that resolver and does
          not store the query.
        status: ready
        fields:
          - id: name
            label: Address
            kind: text
          - id: resolver
            label: Resolver
            kind: choice
            default: cloudflare
            choices:
              - id: cloudflare
                label: Cloudflare
              - id: google
                label: Google
              - id: quad9
                label: Quad9
        actions:
          - id: look-up
            label: Look Up
        outputs:
          - id: result
            label: Result
      - id: mx-lookup
        title: MX Lookup
        summary: >
          Look up the mail servers for a domain. The page lists each MX record
          as a preference and a host, lowest preference first. Choose
          Cloudflare, Google, or Quad9. This site sends the name to that
          resolver and does not store the query.
        status: ready
        fields:
          - id: name
            label: Name
            kind: text
          - id: resolver
            label: Resolver
            kind: choice
            default: cloudflare
            choices:
              - id: cloudflare
                label: Cloudflare
              - id: google
                label: Google
              - id: quad9
                label: Quad9
        actions:
          - id: look-up
            label: Look Up
        outputs:
          - id: result
            label: Result
      - id: spf-inspector
        title: SPF Inspector
        summary: >
          Read the SPF policy published as a TXT record for a domain. The page
          lists each mechanism with its qualifier: pass, fail, softfail, or
          neutral. It reports when the domain has no SPF record or more than
          one. Choose Cloudflare, Google, or Quad9. This site sends the name
          to that resolver and does not store the query.
        status: ready
        fields:
          - id: name
            label: Name
            kind: text
          - id: resolver
            label: Resolver
            kind: choice
            default: cloudflare
            choices:
              - id: cloudflare
                label: Cloudflare
              - id: google
                label: Google
              - id: quad9
                label: Quad9
        actions:
          - id: look-up
            label: Look Up
        outputs:
          - id: result
            label: Result
      - id: dmarc-inspector
        title: DMARC Inspector
        summary: >
          Read the DMARC policy published at _dmarc for a domain. The page
          explains the policy, the subdomain policy, DKIM and SPF alignment,
          and the report fields. It reports when the domain has no DMARC
          record or more than one. Choose Cloudflare, Google, or Quad9. This
          site sends the name to that resolver and does not store the query.
        status: ready
        fields:
          - id: name
            label: Name
            kind: text
          - id: resolver
            label: Resolver
            kind: choice
            default: cloudflare
            choices:
              - id: cloudflare
                label: Cloudflare
              - id: google
                label: Google
              - id: quad9
                label: Quad9
        actions:
          - id: look-up
            label: Look Up
        outputs:
          - id: result
            label: Result
      - id: dnssec-inspector
        title: DNSSEC Inspector
        summary: >
          Check DNSSEC for a domain. The page asks the resolver to validate
          the SOA record and reports Authenticated, No DNSSEC, Validation
          failed, or Name does not exist. It also lists the DNSKEY and DS
          records. Choose Cloudflare, Google, or Quad9. This site sends the
          name to that resolver and does not store the query.
        status: ready
        fields:
          - id: name
            label: Name
            kind: text
          - id: resolver
            label: Resolver
            kind: choice
            default: cloudflare
            choices:
              - id: cloudflare
                label: Cloudflare
              - id: google
                label: Google
              - id: quad9
                label: Quad9
        actions:
          - id: look-up
            label: Look Up
        outputs:
          - id: result
            label: Result
  - id: data
    title: Data
    description: >
      Data formats structured text and converts it between common formats.
      JSON Formatter, YAML Formatter, and XML Formatter format or minify the
      text you paste in. JSON ↔ YAML converts JSON to YAML and YAML to JSON.
      CSV ↔ JSON converts CSV to JSON and JSON to CSV. CSV ↔ YAML converts
      CSV to YAML and YAML to CSV. A pasted file stays on this machine.
    tools:
      - id: json-formatter
        title: JSON Formatter
        summary: >
          Format JSON with a two-space indent, or minify it onto one line.
          Paste the text and the page writes the result. Invalid JSON is
          reported instead of being rewritten.
        status: ready
        actions:
          - id: format
            label: Format
          - id: minify
            label: Minify
      - id: yaml-formatter
        title: YAML Formatter
        summary: >
          Format YAML as a block with a two-space indent, or minify it to a
          compact flow. Paste the text and the page writes the result. Invalid
          YAML is reported instead of being rewritten.
        status: ready
        actions:
          - id: format
            label: Format
          - id: minify
            label: Minify
      - id: json-yaml
        title: "JSON ↔ YAML"
        summary: >
          Convert JSON to YAML, and YAML to JSON. Paste one form and the page
          writes the other, with JSON indented by two spaces. The text stays
          in the browser.
        status: ready
        actions:
          - id: to-yaml
            label: To YAML
          - id: to-json
            label: To JSON
      - id: csv-json
        title: "CSV ↔ JSON"
        summary: >
          Convert CSV to a JSON list of objects, and a JSON list of objects
          back to CSV. The first CSV row is the header, and a repeated header
          name is rejected. The text stays in the browser.
        status: ready
        actions:
          - id: to-json
            label: To JSON
          - id: to-csv
            label: To CSV
      - id: csv-yaml
        title: "CSV ↔ YAML"
        summary: >
          Convert CSV to a YAML list of objects, and a YAML list of objects
          back to CSV. The first CSV row is the header, and a repeated header
          name is rejected. The text stays in the browser.
        status: ready
        actions:
          - id: to-yaml
            label: To YAML
          - id: to-csv
            label: To CSV
      - id: xml-formatter
        title: XML Formatter
        summary: >
          Format XML with an indent for each nested element, or minify it onto
          one line. Paste the text and the page writes the result. Invalid XML
          is reported instead of being rewritten.
        status: ready
        actions:
          - id: format
            label: Format
          - id: minify
            label: Minify
  - id: development
    title: Development
    description: >
      Development covers everyday helpers for identifiers, schedules, and
      versions. UUID Generator creates a version 4 or version 7 UUID, and you
      choose how many. Cron Parser explains a five-field cron expression and
      lists the next run times in UTC. Regex Tester shows the matches for a
      regular expression. Timestamp Converter converts Unix time and a UTC
      date. SemVer Calculator compares semantic versions and steps them.
      A value stays on this machine.
    tools:
      - id: uuid-generator
        title: UUID Generator
        summary: >
          Generate a version 4 or version 7 UUID, and choose how many, from 1
          to 20. Version 4 is random. Version 7 starts with the current time
          so newer identifiers sort later. The page uses the browser's random
          source.
        status: ready
        actions:
          - id: generate
            label: Generate
        fields:
          - id: version
            label: Version
            kind: choice
            default: "4"
            choices:
              - id: "4"
                label: Version 4
              - id: "7"
                label: Version 7
          - id: count
            label: Count
            kind: number
            default: "1"
            min: "1"
            max: "20"
        outputs:
          - id: result
            label: Result
      - id: cron-parser
        title: Cron Parser
        summary: >
          Explain a five-field cron expression: minute, hour, day of month,
          month, and day of week. The page describes each field and lists the
          next five run times in UTC, looking up to four years ahead. Names
          such as JAN and MON are accepted.
        status: ready
        actions:
          - id: explain
            label: Explain
      - id: regex-tester
        title: Regex Tester
        summary: >
          Try a regular expression against sample text. Write the pattern on
          its own, or as /pattern/flags. The flags g, i, m, s, and u are
          accepted, and g is used when you omit flags. The page lists each
          match and its capture groups.
        status: ready
        actions:
          - id: test
            label: Test
        fields:
          - id: pattern
            label: Pattern
            kind: text
          - id: sample
            label: Sample
            kind: text
        outputs:
          - id: result
            label: Result
      - id: timestamp-converter
        title: Timestamp Converter
        summary: >
          Convert a Unix timestamp to a UTC date, and a UTC date to a Unix
          timestamp in seconds. A timestamp of up to 10 digits is seconds. A
          longer one, up to 13 digits, is milliseconds. Dates use the form
          2026-01-02T03:04:05Z, with milliseconds optional.
        status: ready
        actions:
          - id: to-date
            label: To Date
          - id: to-timestamp
            label: To Timestamp
      - id: semver-calculator
        title: SemVer Calculator
        summary: >
          Compare two semantic versions, including a pre-release, and say
          which is newer or that they are equal. Or step one version by major,
          minor, or patch. A patch step on a pre-release drops the
          pre-release and keeps the same core version.
        status: ready
        fields:
          - id: version
            label: Version
            kind: text
          - id: other
            label: Other version
            kind: text
          - id: step
            label: Step
            kind: choice
            default: patch
            choices:
              - id: major
                label: Major
              - id: minor
                label: Minor
              - id: patch
                label: Patch
        actions:
          - id: compare
            label: Compare
          - id: step
            label: Step
        outputs:
          - id: result
            label: Result
  - id: github
    title: GitHub
    description: >
      GitHub checks workflow and dependency files you paste in. Actions YAML
      Validator checks a GitHub Actions workflow file. Dependabot Validator
      checks a Dependabot config file. Workflow Inspector reads a GitHub
      Actions workflow and shows how it is put together. A pasted file stays
      on this machine.
    tools:
      - id: actions-yaml-validator
        title: Actions YAML Validator
        summary: >
          Check a GitHub Actions workflow file you paste in. The page requires
          valid YAML, an on trigger, and at least one job. Each job needs
          runs-on or uses, and each step needs uses or run. A pasted file
          stays on this machine.
        status: ready
        actions:
          - id: check
            label: Check
      - id: dependabot-validator
        title: Dependabot Validator
        summary: >
          Check a Dependabot config file you paste in. The page requires valid
          YAML, version 2, and a list of updates. Each update needs a package
          ecosystem, a directory, and a schedule interval of daily, weekly, or
          monthly. A pasted file stays on this machine.
        status: ready
        actions:
          - id: check
            label: Check
      - id: workflow-inspector
        title: Workflow Inspector
        summary: >
          Read a GitHub Actions workflow you paste in and show how it is put
          together. The page lists the name, the triggers, the permissions,
          the concurrency setting, and each job with its steps. A pasted file
          stays on this machine.
        status: ready
        actions:
          - id: check
            label: Check
