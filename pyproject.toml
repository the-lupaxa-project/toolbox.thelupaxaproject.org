[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lupaxa-web-toolbox"
version = "0.0.0"
description = "Lupaxa Web Toolbox, a static browser-tool site."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.13"
authors = [{ name = "The Lupaxa Project" }]
dependencies = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "types-PyYAML",
  "yamllint>=1.35.0",
]

[project.urls]
Homepage = "https://toolbox.thelupaxaproject.org"
Repository = "https://github.com/the-lupaxa-project/toolbox.thelupaxaproject.org"

[tool.setuptools]
package-dir = {"" = "src", "hooks" = "hooks"}
py-modules = ["version", "tools_lib"]
packages = ["hooks"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "hooks"]
extend-exclude = ["site", ".makefiles", ".venv", "venv", "cursor-docs", ".worktrees", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402", "E501", "SIM108"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src", "hooks", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "hooks"]
